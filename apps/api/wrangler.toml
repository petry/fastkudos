name = "fastkudos-api"
main = "src/index.ts"
compatibility_date = "2024-11-06"
compatibility_flags = ["nodejs_compat"]

[[durable_objects.bindings]]
name = "EVENT_CHANNEL"
class_name = "EventChannel"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["EventChannel"]

[vars]
# Defina como secrets em produção via `wrangler secret put`:
#   DATABASE_URL, JWT_SECRET,
#   GOOGLE_CLIENT_ID, GOOGLE_CLIENT_SECRET,
#   OAUTH_REDIRECT_URI, WEB_BASE_URL.
